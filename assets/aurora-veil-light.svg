<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Aurora Veil — Pham Hoang Gia Hien</title>
<desc id="desc">An atmospheric aurora above a quiet silhouette, with the name Pham Hoang Gia Hien and a software engineer tagline.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f4f9"/><stop offset="1" stop-color="#eaf0f5"/></linearGradient>
<linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20a69e" stop-opacity="0"/><stop offset=".3" stop-color="#20a69e" stop-opacity=".9"/><stop offset=".75" stop-color="#8970cd" stop-opacity=".65"/><stop offset="1" stop-color="#cc7097" stop-opacity="0"/></linearGradient>
<linearGradient id="ribbonB" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#cc7097" stop-opacity="0"/><stop offset=".32" stop-color="#cc7097" stop-opacity=".70"/><stop offset=".72" stop-color="#8970cd" stop-opacity=".62"/><stop offset="1" stop-color="#20a69e" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7ef" stop-opacity="0"/><stop offset="1" stop-color="#e4e7ef" stop-opacity=".94"/></linearGradient>
<filter id="soft" x="-35%" y="-120%" width="170%" height="330%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="fine" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="frame"><rect x="10" y="10" width="1180" height="410" rx="23"/></clipPath>
</defs>
<style>
  @keyframes drift {0% {transform:translate(-45px,-7px) skewX(-5deg)} 50% {transform:translate(42px,13px) skewX(5deg)} 100% {transform:translate(-45px,-7px) skewX(-5deg)}}
  @keyframes drift2 {0% {transform:translate(38px,-11px)} 50% {transform:translate(-44px,7px)} 100% {transform:translate(38px,-11px)}}
  @keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.66}}
  .veil-a{animation:drift 22s ease-in-out infinite}
  .veil-b{animation:drift2 29s ease-in-out infinite}
  .star{animation:twinkle 5s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){.veil-a,.veil-b,.star{animation:none}}
</style>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<g clip-path="url(#frame)">
<rect x="10" y="10" width="1180" height="410" fill="none"/>
<g opacity=".52" filter="url(#soft)">
<path class="veil-a" d="M-80 152C124 9 254 240 466 85S832 63 1260 154L1260 243C845 122 636 225 421 160S115 231-80 244Z" fill="url(#ribbonA)"/>
<path class="veil-b" d="M-99 219C153 302 271 29 512 160S908 66 1286 79L1286 172C861 229 755 130 551 240S200 174-99 278Z" fill="url(#ribbonB)"/>
</g>
<g opacity=".26" filter="url(#fine)">
<path class="veil-a" d="M-60 135C244 40 292 198 558 117S902 90 1280 130" fill="none" stroke="#20a69e" stroke-width="9"/>
<path class="veil-b" d="M-60 225C271 292 350 100 593 164S902 94 1260 88" fill="none" stroke="#cc7097" stroke-width="7"/>
</g>
<g fill="#647c94">
<circle class="star" cx="135" cy="97" r="1.8"/><circle class="star" cx="293" cy="62" r="1.4"/><circle class="star" cx="834" cy="44" r="1.7"/><circle class="star" cx="1102" cy="111" r="1.5"/><circle class="star" cx="973" cy="217" r="1.3"/><circle class="star" cx="660" cy="81" r="1.2"/>
</g>
<path d="M0 336L114 302 213 327 316 279 390 296 491 259 622 309 727 282 810 315 960 273 1102 303 1200 275V430H0Z" fill="#e4e7ef"/>
<path d="M0 354L113 331 210 343 349 320 483 349 609 325 718 345 852 310 981 339 1099 313 1200 330V430H0Z" fill="url(#fade)"/>
</g>
<rect x="10" y="10" width="1180" height="410" rx="23" stroke="#c8d1de" stroke-opacity=".55" fill="none"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#1f2c3a">
<text x="77" y="297" font-size="66" font-style="italic" letter-spacing="-1">Pham Hoang Gia Hien</text>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="80" y="333" font-size="15" letter-spacing="3.2" fill="#5c6b7e">SOFTWARE ENGINEER  /  SYSTEMS BUILDER</text>
<text x="80" y="388" font-size="12" letter-spacing="2.1" fill="#5c6b7e">A JOURNAL OF BUILDING THINGS, UNDERSTANDING WHY THEY WORK.</text>
</g>
<path d="M79 352H235" stroke="#20a69e" opacity=".7" stroke-width="2"/>
</svg>