<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Pham Hoang Gia Hien — Backend engineer and systems builder</title>
<desc id="heroDesc">Original animated futuristic developer command center banner in dark mode</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070F18"/><stop offset="1" stop-color="#111D2B"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#C64BFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163147" stroke-width=".8" opacity=".55"/></pattern>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="clip"><rect x="8" y="8" width="1184" height="339" rx="22"/></clipPath>
</defs>
<style>
@keyframes pulse { 0%,100% { opacity:.35 } 50% {opacity:1} }
@keyframes orbit { to {transform:rotate(360deg)} }
@keyframes dataflow { to {stroke-dashoffset:-70} }
.scan {stroke-dasharray:15 20;animation:dataflow 4s linear infinite}
.pulse {animation:pulse 2.5s ease-in-out infinite}
.orbit {transform-origin:964px 175px;animation:orbit 25s linear infinite}
@media (prefers-reduced-motion:reduce){.scan,.pulse,.orbit{animation:none}}
</style>
<rect width="1200" height="355" rx="26" fill="url(#bg)"/>
<g clip-path="url(#clip)"><rect width="1200" height="355" fill="url(#grid)" opacity=".43"/>
<path d="M0 0H1200M0 354H1200" stroke="#00E5FF" stroke-opacity=".3"/>
<path d="M0 265L435 265L488 303H689" stroke="#00E5FF" opacity=".12" fill="none" stroke-width="2"/>
<path d="M400 35H610L655 81H830" stroke="#C64BFF" opacity=".18" fill="none" stroke-width="2"/>
<circle cx="1125" cy="-40" r="170" fill="#00E5FF" opacity=".04"/>
<circle cx="900" cy="340" r="200" fill="#C64BFF" opacity=".04"/>
</g>
<rect x="8" y="8" width="1184" height="339" rx="22" fill="none" stroke="#274055" stroke-width="1.5"/>
<path d="M40 65V32H285M1160 292V324H925" stroke="url(#accent)" stroke-width="3" fill="none"/>
<g font-family="monospace" font-size="15" fill="#8A9DAF"><text x="46" y="57">PORTFOLIO / DEVELOPER PROFILE</text><text x="46" y="306">UIT · HO CHI MINH CITY · VIETNAM</text><text x="904" y="326">SYSTEMS / AGENTS / CLOUD</text></g>
<rect x="45" y="86" width="160" height="27" rx="8" fill="#0F1824" stroke="#274055"/>
<circle cx="61" cy="100" r="5" fill="#4BE7B7" class="pulse"/>
<text x="74" y="105" font-family="monospace" font-size="13" fill="#E6F5FF">BUILD MODE / ON</text>
<text x="43" y="171" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="53" letter-spacing="1.1" fill="#E6F5FF">PHAM HOANG</text>
<text x="43" y="229" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="61" letter-spacing="2" fill="url(#accent)">GIA HIEN</text>
<text x="48" y="259" font-family="monospace" font-size="19" fill="#8A9DAF">JAVA BACKEND  /  AI SYSTEMS  /  SOFTWARE ENGINEERING</text>
<g>
<circle cx="964" cy="175" r="125" fill="#0F1824" stroke="#274055" stroke-width="1"/>
<circle cx="964" cy="175" r="111" fill="none" stroke="#00E5FF" stroke-opacity=".40" stroke-dasharray="3 11" stroke-width="2"/>
<circle cx="964" cy="175" r="91" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="35 18 60 20"/>
<g class="orbit"><circle cx="964" cy="64" r="7" fill="#00E5FF"/><circle cx="964" cy="64" r="15" fill="#00E5FF" opacity=".15"/></g>
<circle cx="964" cy="175" r="70" fill="#111D2B" stroke="#274055" stroke-width="2"/>
<path d="M935 140V211M994 140V211M935 175H994" stroke="url(#accent)" stroke-width="12" stroke-linecap="square"/>
<path d="M1095 149H1141M1095 194H1162M819 146H853M813 203H853" stroke="#274055" stroke-width="2" stroke-dasharray="7 6" class="scan"/>
<circle cx="1141" cy="149" r="4" fill="#00E5FF"/><circle cx="1162" cy="194" r="4" fill="#C64BFF"/>
